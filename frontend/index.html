<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liveness Kiosk</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;background:#0b1020;color:#eef2ff}
*{box-sizing:border-box}body{margin:0;padding:20px}
main{max-width:1150px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:26px;margin:0}h2{font-size:16px;margin:0 0 10px}
.pill{border:1px solid #34415e;border-radius:99px;padding:6px 12px;font-size:13px}
.on{color:#48e0a1;border-color:#48e0a1}.off{color:#ffc66d;border-color:#ffc66d}
.grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,1fr);gap:16px;margin-top:16px}
.card{background:#111a2e;border:1px solid #283653;border-radius:14px;padding:16px}
video{width:100%;aspect-ratio:4/3;object-fit:cover;background:#050914;border-radius:10px;transform:scaleX(-1);display:block}
#overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
button{border:0;border-radius:9px;padding:11px 15px;background:#5b6cff;color:#fff;font-weight:700;cursor:pointer;font-size:14px}
button.sec{background:#273653}button:disabled{opacity:.45;cursor:not-allowed}
select,input{background:#0b1326;color:#eef2ff;border:1px solid #34415e;border-radius:8px;padding:9px;font-size:14px}
label{font-size:12px;color:#a8b3cc;display:flex;flex-direction:column;gap:4px}
#decision{font-size:40px;font-weight:800;padding:18px;border-radius:12px;text-align:center;background:#1a2944}
.ALLOW{background:#0f5132!important}.DENY{background:#7a1f1f!important}.REQUEST_VERIFICATION{background:#7a5a0f!important}
#message{margin:10px 0;font-size:16px;min-height:22px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 8px;border-bottom:1px solid #24304a;text-align:left}
th{color:#a8b3cc;font-weight:600}.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:#a8b3cc;font-size:12px}.hidden{display:none}
code{background:#0b1326;padding:2px 6px;border-radius:5px;word-break:break-all}
.cam{position:relative}.oval{position:absolute;left:50%;top:48%;width:34%;height:58%;transform:translate(-50%,-50%);border:3px dashed #ffffffaa;border-radius:50%;pointer-events:none}
.hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:13px;text-shadow:0 1px 3px #000}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<div class="top">
  <h1>Face Liveness + Access Kiosk</h1>
  <div class="row" style="margin:0">
    <span class="pill" id="link">Central: checking…</span>
    <span class="pill" id="queue">Queued: –</span>
    <button class="sec" id="offlineBtn">Simulate connection loss</button>
  </div>
</div>

<div class="grid">
  <section class="card">
    <div class="cam"><video id="video" autoplay playsinline muted></video><canvas id="overlay"></canvas><div class="oval"></div><div class="hint" id="hint">Fit your face inside the oval</div></div>
    <div class="row">
      <label>Zone<select id="zone"></select></label>
      <label>Test label (what is really in front of the camera)
        <select id="label">
          <option value="">none (normal use)</option>
          <option value="genuine">genuine: enrolled live person</option>
          <option value="impostor">impostor: live person, not enrolled</option>
          <option value="print">attack: printed photo</option>
          <option value="screen">attack: photo on a screen</option>
          <option value="video">attack: video replay</option>
          <option value="mask">attack: mask</option>
        </select></label>
      <label>Pretend time (optional)<input type="datetime-local" id="at"></label>
      <label>Light challenge (trial)<select id="lightOn"><option value="">off</option><option value="1">on</option></select></label>
    </div>
    <div class="row">
      <button id="auth" disabled>Authenticate</button>
      <button class="sec" id="collect" disabled>Collect 10 samples for the test label</button>
      <span class="muted" id="camState">Starting camera…</span>
    </div>
  </section>

  <section class="card">
    <div id="decision">—</div>
    <div id="message"></div>
    <div id="stepup" class="row hidden">
      <input id="code" inputmode="numeric" maxlength="6" placeholder="6-digit code" style="width:150px">
      <button id="codeBtn">Verify code</button>
    </div>
    <table id="details"></table>
  </section>
</div>

<div class="grid">
  <section class="card">
    <h2>Enrol a person</h2>
    <div class="row">
      <input id="name" placeholder="Name">
      <select id="role"><option>student</option><option>staff</option></select>
      <button id="enrol" disabled>Enrol from camera</button>
    </div>
    <div id="enrolMsg" class="muted" style="margin-top:8px"></div>
    <table id="users" style="margin-top:10px"></table>
  </section>
  <section class="card">
    <h2>Measured results (from labelled test attempts)</h2>
    <table id="eval"></table>
    <div class="row"><button class="sec" id="evalRefresh">Refresh</button><button class="sec" id="evalClear">Clear results</button></div>
  </section>
</div>
</main>
<div id="flash" style="display:none;position:fixed;inset:0;z-index:99;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#000a">Hold still…</div>

<script>
const $ = id => document.getElementById(id);
const video = $("video"), canvas = document.createElement("canvas");
const FRAMES = 6, GAP_MS = 80;          // 6 frames spanning about 0.4 s
let session = null;
// The page keeps the latest frames ready all the time, so pressing
// Authenticate does not have to wait for the camera.
const buffer = [];                       // {blob, t}
let grabbing = false;
async function tick() {
  if (grabbing || video.readyState < 2 || !video.videoWidth) return;
  grabbing = true;
  try {
    const t = performance.now(), blob = snap();
    buffer.push({ blob, t }); while (buffer.length > FRAMES) buffer.shift();
  } finally { grabbing = false; }
}
// Light challenge: fill the screen with the colour sequence the kiosk service
// just picked, and record the face while each colour is showing.
async function lightChallenge() {
  const c = await api("/api/light/start", { method: "POST" });
  const el = $("flash"), frames = [], total = c.colours.length * c.step_ms;
  el.style.display = "flex";
  const t0 = performance.now(); let cur = -1;
  while (true) {
    const t = performance.now() - t0;
    if (t >= total) break;
    const idx = Math.floor(t / c.step_ms);
    if (idx !== cur) { cur = idx; el.style.background = "rgb(" + c.colours[idx].join(",") + ")"; }
    frames.push({ blob: snap(), t: performance.now() - t0 });
    await new Promise(res => setTimeout(res, 45));
  }
  el.style.display = "none";
  return { id: c.id, frames, ms: total };
}

// Live overlay: ask the kiosk service where the face is and draw it.
let tracking = false;
async function trackFace() {
  if (tracking || !buffer.length || document.hidden) return;
  tracking = true;
  try {
    const fd = new FormData(); fd.append("frame", buffer[buffer.length - 1].blob, "t.jpg");
    const t = await api("/api/track", { method: "POST", body: fd });
    const o = $("overlay"), g = o.getContext("2d");
    if (o.width !== canvas.width) { o.width = canvas.width; o.height = canvas.height; }
    g.clearRect(0, 0, o.width, o.height);
    if (!t.faces) { $("hint").textContent = "No face in view"; return; }
    const [x, y, w, h] = t.box, [re, le, nose, mr, ml] = t.points;
    const ok = t.faces === 1 && t.face_ratio <= 0.55 && w >= 80;
    const col = ok ? "#48e0a1" : "#ffc66d";
    g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 2;
    const c = Math.min(w, h) * 0.22;                     // corner brackets around the face
    [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]].forEach(([px, py, sx, sy]) => {
      g.beginPath(); g.moveTo(px + sx * c, py); g.lineTo(px, py); g.lineTo(px, py + sy * c); g.stroke(); });
    g.lineWidth = 1.5; g.beginPath();                    // lines joining eyes, nose and mouth
    [[re, le], [re, nose], [le, nose], [nose, mr], [nose, ml], [mr, ml], [re, mr], [le, ml]].forEach(([a, b]) => { g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); });
    g.stroke();
    t.points.forEach(p => { g.beginPath(); g.arc(p[0], p[1], 3.5, 0, 6.3); g.fill(); });
    $("hint").textContent = t.faces > 1 ? "One person at a time" : t.face_ratio > 0.55 ? "Move back a little" : w < 80 ? "Move closer" : "Good position";
  } catch (e) { /* overlay is cosmetic; ignore errors */ } finally { tracking = false; }
}

async function freshFrames() {
  const deadline = performance.now() + 1500;
  while (performance.now() < deadline) {
    if (buffer.length === FRAMES && performance.now() - buffer[0].t < 900) break;
    await new Promise(res => setTimeout(res, 40));
  }
  return buffer.slice();
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || ("Request failed: " + r.status));
  return data;
}
function cell(tr, text, cls) { const td = document.createElement("td"); td.textContent = text; if (cls) td.className = cls; tr.appendChild(td); return td; }
function rows(table, head, body) {
  table.replaceChildren();
  if (head) { const tr = document.createElement("tr"); head.forEach(h => { const th = document.createElement("th"); th.textContent = h; tr.appendChild(th); }); table.appendChild(tr); }
  body.forEach(r => { const tr = document.createElement("tr"); r.forEach((c, i) => cell(tr, c, i ? "num" : "")); table.appendChild(tr); });
}
const f2 = v => v == null ? "–" : Number(v).toFixed(2);
const ms = v => v == null ? "–" : Math.round(v) + " ms";
const pc = v => v == null ? "–" : Math.round(v * 100) + "%";

let ctx = null;
function snap() {
  // Encode straight away. (canvas.toBlob waits for the browser to be idle and
  // was taking up to half a second per frame.)
  if (!ctx) {
    canvas.width = 640; canvas.height = Math.round(640 * video.videoHeight / video.videoWidth);
    ctx = canvas.getContext("2d", { willReadFrequently: true });
  }
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const bin = atob(canvas.toDataURL("image/jpeg", 0.85).split(",")[1]);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: "image/jpeg" });
}
async function grabFrames(n, gap = GAP_MS) {
  const out = [];
  for (let i = 0; i < n; i++) {
    out.push(snap());
    if (i < n - 1) await new Promise(res => setTimeout(res, gap));
  }
  return out;
}

function show(d, clientMs) {
  $("decision").textContent = d.decision === "REQUEST_VERIFICATION" ? "STEP-UP VERIFICATION" : d.decision;
  $("decision").className = d.decision;
  $("message").textContent = (d.name ? d.name + ": " : "") + (d.message || "");
  session = d.step === "totp" ? d.session_id : null;
  $("stepup").classList.toggle("hidden", !session);
  if (session) { $("code").value = ""; $("code").focus(); }
  if (d.step === "action") runChallenge(d.session_id, d.direction);
  if (d.timing_ms) rows($("details"), null, [
    ["Decision time (first frame to answer on screen)", ms(clientMs)],
    ["  camera frames span", ms(d.timing_ms.capture)],
    ["  models (detect + liveness + identity)", ms(d.timing_ms.models)],
    ["Liveness score (1 = real)", f2(d.live)],
    ["  per model (surroundings / skin texture)", (d.live_models || []).map(f2).join(" / ") || "–"],
    ["Light response (trial): match / strength", d.light ? (d.light.corr == null ? "–" : d.light.corr.toFixed(2)) + " / " + (d.light.amp == null ? "–" : (d.light.amp * 100).toFixed(1) + "%") : "off"],
    ["  colour sequence shown", d.light ? d.light.sequence.join(", ") : "–"],
    ["Face size (share of frame height)", d.face_ratio == null ? "–" : pc(d.face_ratio)],
    ["Identity match score", f2(d.match)],
    ["Schedule", d.schedule],
    ["Mode", d.online ? "online" : "OFFLINE (stricter rules)"],
    ["Reason code", d.reason],
  ]);
}

$("auth").onclick = async () => {
  $("auth").disabled = true;
  const t0 = performance.now();
  try {
    const frames = await freshFrames();
    if (!frames.length) throw new Error("Camera is not giving frames yet. Try again.");
    let span = performance.now() - frames[0].t;     // how far back the frames reach
    const fd = new FormData();
    if ($("lightOn").value) {
      const lc = await lightChallenge();
      span += lc.ms;
      fd.append("light_id", lc.id); fd.append("light_t", JSON.stringify(lc.frames.map(f => f.t)));
      lc.frames.forEach((f, i) => fd.append("light_frames", f.blob, "l" + i + ".jpg"));
    }
    const tSend = performance.now();
    frames.forEach((f, i) => fd.append("frames", f.blob, i + ".jpg"));
    fd.append("zone", $("zone").value); fd.append("label", $("label").value);
    fd.append("at", $("at").value); fd.append("capture_ms", span);
    const d = await api("/api/authenticate", { method: "POST", body: fd });
    show(d, span + performance.now() - tSend);
  } catch (e) { $("decision").textContent = "ERROR"; $("decision").className = ""; $("message").textContent = e.message; }
  if (!challenging) $("auth").disabled = false;
  refresh();
};

// Quick data collection: 10 captures in a row for the chosen test label.
// Records the scores and frames only. No step-up, no door decision.
$("collect").onclick = async () => {
  if (!$("label").value) { $("message").textContent = "Choose a Test label first."; return; }
  $("collect").disabled = true; $("auth").disabled = true;
  for (let i = 1; i <= 10; i++) {
    const frames = await freshFrames(), fd = new FormData();
    frames.forEach((f, k) => fd.append("frames", f.blob, k + ".jpg"));
    fd.append("zone", $("zone").value); fd.append("label", $("label").value);
    fd.append("collect", "1"); fd.append("capture_ms", performance.now() - frames[0].t);
    try {
      const d = await api("/api/authenticate", { method: "POST", body: fd });
      $("decision").textContent = "Sample " + i + " / 10"; $("decision").className = "";
      $("message").textContent = "Liveness per model: " + (d.live_models || []).map(f2).join(" / ") + "   match " + f2(d.match);
    } catch (e) { $("message").textContent = e.message; }
    await new Promise(res => setTimeout(res, 700));
  }
  $("decision").textContent = "Done"; $("collect").disabled = false; $("auth").disabled = false; refreshEval();
};

// Head-turn challenge: the server picked the direction at random just now.
let challenging = false;
async function runChallenge(sessionId, direction) {
  challenging = true; $("auth").disabled = true;
  const arrow = direction === "left" ? "⬅  TURN YOUR HEAD LEFT" : "TURN YOUR HEAD RIGHT  ➡";
  $("decision").textContent = arrow; $("decision").className = "REQUEST_VERIFICATION";
  $("message").textContent = "Face the camera and keep still for a moment, then turn your head to your " + direction + ". Two correct moves are needed.";
  try {
    const frames = await grabFrames(14, 170);          // about 2.4 s
    const fd = new FormData(); fd.append("session_id", sessionId);
    frames.forEach((b, i) => fd.append("frames", b, i + ".jpg"));
    const d = await api("/api/challenge", { method: "POST", body: fd });
    if (d.step === "action") {
      $("message").textContent = d.message;
      await new Promise(res => setTimeout(res, 1200));   // time to face the camera again
      return runChallenge(d.session_id, d.direction);
    }
    $("decision").textContent = d.decision; $("decision").className = d.decision;
    $("message").textContent = (d.name ? d.name + ": " : "") + d.message + " (" + d.reason + ")";
  } catch (e) { $("decision").textContent = "ERROR"; $("decision").className = ""; $("message").textContent = e.message; }
  challenging = false; $("auth").disabled = false; refresh(); refreshEval();
}

$("codeBtn").onclick = async () => {
  if (!session) return;
  const fd = new FormData(); fd.append("session_id", session); fd.append("code", $("code").value);
  try {
    const d = await api("/api/stepup", { method: "POST", body: fd });
    $("decision").textContent = d.decision === "REQUEST_VERIFICATION" ? "STEP-UP VERIFICATION" : d.decision;
    $("decision").className = d.decision;
    $("message").textContent = (d.name ? d.name + ": " : "") + d.message;
    if (d.step !== "totp") { session = null; $("stepup").classList.add("hidden"); }
  } catch (e) { $("message").textContent = e.message; session = null; $("stepup").classList.add("hidden"); }
  refresh();
};
$("code").onkeydown = e => { if (e.key === "Enter") $("codeBtn").click(); };

$("enrol").onclick = async () => {
  const name = $("name").value.trim();
  if (!name) { $("enrolMsg").textContent = "Enter a name first."; return; }
  $("enrol").disabled = true; $("enrolMsg").textContent = "Look at the camera and turn your head slightly…";
  try {
    const fd = new FormData();
    for (let i = 0; i < 5; i++) {      // 5 shots over about 2 s for some pose variety
      (await grabFrames(1)).forEach(b => fd.append("frames", b, i + ".jpg"));
      await new Promise(res => setTimeout(res, 400));
    }
    fd.append("name", name); fd.append("role", $("role").value);
    const u = await api("/api/enroll", { method: "POST", body: fd });
    $("enrolMsg").replaceChildren("Enrolled " + u.name + " with " + u.templates + " templates. Add this key to an authenticator app (shown once): ");
    const c = document.createElement("code"); c.textContent = u.totp_secret; $("enrolMsg").appendChild(c);
    $("name").value = "";
  } catch (e) { $("enrolMsg").textContent = e.message; }
  $("enrol").disabled = false; refresh();
};

async function refresh() {
  try {
    const s = await api("/api/status");
    $("link").textContent = s.online ? "Central: online" : "Central: OFFLINE";
    $("link").className = "pill " + (s.online ? "on" : "off");
    $("queue").textContent = "Queued locally: " + s.queued + " · Synced to central: " + (s.central_events ?? "–");
    $("offlineBtn").textContent = s.forced_offline ? "Restore connection" : "Simulate connection loss";
    $("offlineBtn").dataset.on = s.forced_offline ? "1" : "";
    if (!$("zone").options.length) for (const [k, z] of Object.entries(s.zones)) $("zone").add(new Option(z.label + (z.restricted ? " (restricted)" : ""), k));
    const us = await api("/api/users");
    const t = $("users"); t.replaceChildren();
    us.forEach(u => { const tr = document.createElement("tr"); cell(tr, u.name); cell(tr, u.role);
      const b = document.createElement("button"); b.className = "sec"; b.textContent = "Remove"; b.style.padding = "5px 9px";
      b.onclick = async () => { await api("/api/users/" + u.id, { method: "DELETE" }); refresh(); };
      cell(tr, "", "num").appendChild(b); t.appendChild(tr); });
  } catch (e) { $("link").textContent = "Kiosk service not reachable"; $("link").className = "pill off"; }
}
async function refreshEval() {
  const e = await api("/api/eval/summary");
  rows($("eval"), ["Scenario", "Tries", "Allow", "Step-up", "Deny", "Correct", "Error", "Avg live", "p50", "p95", "≤2 s"],
    e.scenarios.map(s => [s.scenario, s.attempts, s.allow, s.step_up, s.deny, pc(s.correct_rate),
      pc(s.error_rate) + " " + s.error_name, f2(s.live_avg), ms(s.ms_p50), ms(s.ms_p95), pc(s.within_2s)]));
  if (!e.scenarios.length) $("eval").textContent = "No labelled attempts yet. Pick a test label and authenticate.";
}
$("evalRefresh").onclick = refreshEval;
$("evalClear").onclick = async () => { if (confirm("Delete all test results?")) { await api("/api/eval", { method: "DELETE" }); refreshEval(); } };
$("offlineBtn").onclick = async () => {
  const fd = new FormData(); fd.append("on", $("offlineBtn").dataset.on ? "false" : "true");
  await api("/api/debug/offline", { method: "POST", body: fd }); refresh();
};

(async () => {
  refresh(); refreshEval(); setInterval(refresh, 3000); setInterval(refreshEval, 5000);
  try {
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 }, aspectRatio: { ideal: 4 / 3 } }, audio: false });
    await video.play();
    setInterval(tick, GAP_MS); setInterval(trackFace, 200);
    $("camState").textContent = "Camera ready."; $("auth").disabled = false; $("collect").disabled = false; $("enrol").disabled = false;
  } catch (e) { $("camState").textContent = "Camera failed: " + e.message; }
})();
</script>
</body></html>
